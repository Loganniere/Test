{% extends "base.html" %}
{% block title %}Registrazione — Auto Solari{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0"><i class="bi bi-person-plus"></i> Registrazione</h4>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nome <span class="text-danger">*</span></label>
              <input type="text" name="nome" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Cognome <span class="text-danger">*</span></label>
              <input type="text" name="cognome" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <div class="col-12">
              <label class="form-label">Via / Indirizzo</label>
              <input type="text" name="via" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Comune <span class="text-danger">*</span></label>
              <input type="text" name="comune" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Distretto <span class="text-danger">*</span></label>
              <input type="text" name="distretto" class="form-control" required>
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100 mt-4">
            <i class="bi bi-person-plus"></i> Registrati
          </button>
        </form>
      </div>
      <div class="card-footer text-center">
        Hai già un account? <a href="{{ url_for('login') }}">Accedi</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
